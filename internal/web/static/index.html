<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nutshell</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="narrator.css">
<link rel="stylesheet" href="transcribe.css">
<link rel="stylesheet" href="threads.css">
</head>
<body>
<aside class="rail">
  <header class="rail-head">
    <img class="mark" src="logo.svg" alt="" width="48" height="48">
    <div class="titles">
      <div class="brand" id="brand"></div>
      <div class="status"><span id="status"></span><span id="session-cost" class="cost" hidden></span></div>
    </div>
  </header>

  <nav id="trail" class="trail" hidden></nav>

  <div id="transcript" class="transcript">
    <div id="empty" class="empty"><p id="empty-hint"></p></div>
  </div>

  <footer class="rail-foot" id="foot" data-state="idle">
    <div id="unsent" class="unsent" role="alert" hidden>
      <p class="unsent-text" dir="auto"></p>
      <div class="unsent-actions">
        <button class="unsent-retry" type="button"></button>
        <button class="unsent-discard" type="button"></button>
      </div>
    </div>
    <div id="thread-bar" class="thread-bar" hidden>
      <span class="thread-note"></span>
      <button class="thread-done" type="button"></button>
      <button class="thread-drop" type="button"></button>
    </div>
    <div id="quote" class="quote" hidden>
      <span class="quote-text"></span>
      <button class="quote-clear icon-btn" type="button"></button>
    </div>
    <div class="foot-row">
      <button id="talk" class="mic" type="button"></button>
      <textarea id="input" rows="1" spellcheck="false"></textarea>
      <button id="fork" class="icon-btn" type="button"></button>
      <button id="settings-btn" class="icon-btn" type="button"></button>
      <div class="thinking" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <p id="foot-note" class="foot-note" hidden></p>
  </footer>
</aside>

<main class="doc" id="doc">
  <div class="doc-head">
    <span class="doc-tools">
      <span id="doc-cost" class="cost" hidden></span>
      <button id="listen" class="icon-btn" type="button" hidden></button>
      <button id="copy" class="icon-btn" type="button"></button>
      <button id="doc-close" class="icon-btn narrow-only" type="button"></button>
    </span>
  </div>
  <div id="narrator" class="narrator" dir="ltr" hidden>
    <div class="np-row">
      <button class="np-toggle" type="button"></button>
      <button class="np-back np-skip icon-btn" type="button"></button>
      <button class="np-forward np-skip icon-btn" type="button"></button>
      <div class="np-seek">
        <span class="np-time np-elapsed"></span>
        <div class="np-track" role="slider" aria-valuemin="0">
          <div class="np-ready"></div>
          <div class="np-played"></div>
          <div class="np-knob"></div>
        </div>
        <span class="np-time np-total"></span>
      </div>
      <button class="np-rate" type="button"></button>
      <button class="np-close icon-btn" type="button"></button>
    </div>
    <div class="np-note" hidden></div>
  </div>
  <article id="doc-body" class="md" dir="auto" hidden></article>
  <div id="doc-empty" class="doc-empty">
    <img class="mark" src="logo.svg" alt="" width="88" height="88">
    <p></p>
  </div>
</main>

<div id="selection-bar" class="selection-bar" hidden>
  <button type="button" data-act="read"></button>
  <button type="button" data-act="summary"></button>
  <button type="button" data-act="ask"></button>
  <button type="button" data-act="fork"></button>
</div>

<div id="settings" class="sheet" hidden></div>
<div id="prompt" class="modal" hidden></div>

<template id="turn-template">
  <article class="turn">
    <div class="q-quote" hidden></div>
    <div class="q" dir="auto"></div>
    <div class="activity" hidden></div>
    <div class="summary" dir="auto" hidden></div>
    <div class="meta" hidden>
      <button class="speak icon-btn" type="button"></button>
      <button class="open-full narrow-only" type="button"></button>
      <span class="cost" hidden></span>
    </div>
    <div class="clips" hidden></div>
    <div class="error" dir="auto" hidden></div>
  </article>
</template>

<template id="thread-template">
  <article class="side">
    <div class="side-head">
      <span class="side-label"></span>
      <span class="side-title" dir="auto"></span>
    </div>
    <div class="side-note" dir="auto" hidden></div>
  </article>
</template>

<template id="clip-template">
  <div class="clip">
    <button class="clip-play icon-btn" type="button"></button>
    <div class="clip-body">
      <div class="clip-label"></div>
      <div class="clip-quote"></div>
      <div class="clip-text" hidden></div>
    </div>
  </div>
</template>

<script src="vendor/marked.min.js"></script>
<script src="i18n.js"></script>
<script src="report.js"></script>
<script src="lang/en.js"></script>
<script src="lang/fa.js"></script>
<script src="settings.js"></script>
<script src="prompt.js"></script>
<script src="audio.js"></script>
<script src="cost.js"></script>
<script src="session.js"></script>
<script src="threads.js"></script>
<script src="selection.js"></script>
<script src="clips.js"></script>
<script src="speakable.js"></script>
<script src="narrator.js"></script>
<script src="transcribe.js"></script>
<script src="app.js"></script>
</body>
</html>
